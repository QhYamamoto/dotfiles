gui:
  theme:
    selectedLineBgColor:
      - reverse
  # expandFocusedSidePanel: true
  # 左カラム(コミット一覧等)と右のmain側(commit log/command log)の幅比。
  # 注意: lazygitは内部で左カラム実効幅 = 1/int(1/sidePanelWidth) と整数丸めするため、
  # 取れる値は離散的(0.20→20% / 0.25→25% / (0.25,0.333]→33% / (0.333,0.5]→50%)。
  # 0.28等の中間値は無意味(0.3と同じ33%になる)。0.34以上は50%に跳ねmainが狭すぎて崩れる。
  # log側を崩さず最も狭くできる33%(=0.3)にする。
  sidePanelWidth: 0.3
customCommands:
  - key: "<C-p>"
    description: "Pull (force)"
    context: "localBranches"
    command: 'git stash save "stashed by force pull" && git fetch && git reset --hard origin/$(git rev-parse --abbrev-ref @)'
    prompts:
      - type: "confirm"
        title: "Pull (force)"
        body: "Are you sure you want to force pull? (Your local changes will be stashed.)"
  - key: "<c-space>"
    description: "Checkout (with auto-stash and auto-pop)"
    context: "localBranches"
    command: 'git stash save "auto-stash" && git checkout {{ .SelectedLocalBranch.Name }} && git stash pop'
  - key: "E"
    description: "create empty commit"
    command: "git commit --allow-empty -m {{index .PromptResponses 0 | quote}}"
    context: "files"
    prompts:
      - type: "input"
        title: "Empty commit message"
        initialValue: ""
  - key: "R"
    description: "Reset latest commit"
    command: "git reset --{{.Form.ResetOption}} HEAD^"
    context: "commits"
    prompts:
      - type: "menu"
        title: "Select reset option"
        key: "ResetOption"
        options:
          - name: "Soft"
            value: "soft"
          - name: "Hard"
            value: "hard"
          - name: "Mixed"
            value: "mixed"
os:
  # nvim内(toggletermのフロート)からファイルを開くと、--remote-tabだと新規タブが、
  # --remoteだとフロート自身に開いて既存レイアウトに覆いかぶさってしまう。
  # そこで親nvimのLua関数(_G.lazygit_open)を--remote-exprで呼び、フロートを閉じてから
  # 背後の通常ウィンドウでファイルを開く。filenameはlazygitのシェルクオートを避けるため
  # base64で渡す。nvim外($NVIM未設定)では通常起動。
  # editは--remote-exprで即座に返るので、lazygitをサスペンドさせない
  # (editInTerminal=false)。これで編集後の "press Enter to return" が出ない。
  editInTerminal: false
  edit: '[ -z "$NVIM" ] && nvim -- {{filename}} || nvim --server "$NVIM" --remote-expr "v:lua.lazygit_open(''$(printf %s {{filename}} | base64 -w0)'', 0)" >/dev/null'
  editAtLine: '[ -z "$NVIM" ] && nvim +{{line}} -- {{filename}} || nvim --server "$NVIM" --remote-expr "v:lua.lazygit_open(''$(printf %s {{filename}} | base64 -w0)'', {{line}})" >/dev/null'
  editAtLineAndWait: 'nvim +{{line}} -- {{filename}}'
git:
  paging:
    colorArg: always
    pager: delta -n -s --dark --paging=never
  allBranchesLogCmd: git log --graph --color=always --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%C(#a0a0a0 reverse)%h%Creset %C(cyan)%ad%Creset %C(#dd4814)%ae%Creset %C(yellow reverse)%d%Creset %n%C(white bold)%s%Creset%n' --
  branchLogCmd: git log --graph --color=always --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%C(#a0a0a0 reverse)%h%Creset %C(cyan)%ad%Creset %C(#dd4814)%ae%Creset %C(yellow reverse)%d%Creset %n%C(white bold)%s%Creset%n' {{branchName}} --
